[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thaum"
version = "0.7.0rc1"
description = "Chat-driven on-call and team alerting"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
dependencies = [
    "gemstone_utils==0.5.0a2",
    'tzdata; platform_system == "Windows"',
    "Flask",
    "gunicorn",
    "pydantic>=2.0",
    "python-json-logger>=2.0.7",
    "webexpythonsdk",
    "SQLAlchemy",
    "ldap3",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0,<9",
    "myst-parser>=2.0,<5",
    "sphinx-design>=0.5",
    "sphinx-copybutton>=0.5",
    "furo>=2024.0.0",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["thaum*", "alerts*", "bots*", "connections*", "lookup*"]
